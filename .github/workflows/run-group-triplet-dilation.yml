name: Independent run-group triplet dilation

on:
  workflow_dispatch:
  push:
    paths:
      - "lhcb_wct_analysis_kit/31_run_group_triplet_dilation.py"
      - "lhcb_wct_analysis_kit/31_run_group_triplet_dilation_xrootd.py"
      - ".github/workflows/run-group-triplet-dilation.yml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  triplet-dilation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip install xrootd
      - name: Run independent triplet/dilation test
        working-directory: lhcb_wct_analysis_kit
        run: |
          python 31_run_group_triplet_dilation_xrootd.py --step-size "100 MB" --top-wells 12
      - name: Show summary
        if: always()
        working-directory: lhcb_wct_analysis_kit
        run: |
          if [ -f outputs_run_group_triplet_dilation/run_group_dilation_summary.json ]; then
            cat outputs_run_group_triplet_dilation/run_group_dilation_summary.json
          fi
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-group-triplet-dilation-results
          path: |
            lhcb_wct_analysis_kit/outputs_run_group_triplet_dilation/run_group_scan_curve.csv
            lhcb_wct_analysis_kit/outputs_run_group_triplet_dilation/run_group_wells.csv
            lhcb_wct_analysis_kit/outputs_run_group_triplet_dilation/run_group_triplets.csv
            lhcb_wct_analysis_kit/outputs_run_group_triplet_dilation/run_group_dilation_summary.json
          if-no-files-found: warn

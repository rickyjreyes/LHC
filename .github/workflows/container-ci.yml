name: CPU analysis and container CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Validate pipeline plan without data
        run: python run_all.py --dry-run

  container:
    runs-on: ubuntu-24.04
    needs: cpu-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU image
        run: docker build --tag lhc-wct-ci .
      - name: Validate container pipeline plan
        run: docker run --rm lhc-wct-ci
